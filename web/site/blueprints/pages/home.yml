title: Home Page

fields:

  headers:
    label: Headers
    type: structure
    fields:
      desktop_image:
        label: Desktop Image
        type: files
        multiple: false
      mobile_image:
        label: Mobile Image
        type: files
        multiple: false
      desktop_color:
        label: Desktop Color
        type: color
      mobile_color:
        label: Mobile Color
        type: color
      desktop_x_offset:
        label: Desktop X-Offset
        type: number
        step: .01
      desktop_y_offset:
        label: Desktop Y-Offset
        type: number
        step: .01
      mobile_x_offset:
        label: Mobile X-Offset
        type: number
        step: .01
      mobile_y_offset:
        label: Mobile Y-Offset
        type: number
        step: .01
      desktop_caption:
        type: text
      mobile_caption:
        type: text

  body:
    label: Body
    type: blocks
    fieldsets:
      body_text:
        label: Body Text
        fields:
          text:
            type: writer
            nodes: false
            marks: [italic, link]
      header_text:
        label: Header Text
        fields:
          text:
            type: writer
            nodes: false
            marks: []
      header_figure:
        label: Header Figure
        fields:
          title:
            type: writer
            nodes: false
            marks: []
          image:
            type: files
            multiple: false
          text:
            type: writer
            nodes: false
            marks: []
      labeled_description:
        label: Labeled Description
        fields:
          label:
            type: text
          description:
            type: writer
            nodes: false
            marks: [italic, link]
      featured_exhibitors:
        label: Featured Exhibitors
        fields:
          exhibitors:
            type: structure
            fields:
              image:
                type: files
                multiple: false
              name:
                type: text
              link:
                type: link
